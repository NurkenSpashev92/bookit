services:
  postgres_db:
    image: postgres:latest
    restart: unless-stopped
    container_name: postgres_db
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Общая часть. Образ задаётся оверрайдом: devops/Dockerfile в prod,
  # готовый golang в dev — базовый файл сам по себе не запускается.
  app:
    container_name: app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT}:8080"
      - "${PPROF_PORT:-6060}:6060"
    depends_on:
      postgres_db:
        condition: service_healthy

  redis:
    image: redis:alpine
    container_name: redis
    volumes:
        - ./redis:/data
    ports:
        - "6379:6379"

  migrate:
    image: migrate/migrate:v4.19.1
    profiles: ["tools"]
    env_file:
      - .env
    volumes:
      - ./app/migrations:/migrations
    depends_on:
      postgres_db:
        condition: service_healthy

volumes:
  postgres_data:
