services:
  app:
    image: golang:1.26
    working_dir: /app
    volumes:
      - ./app:/app
      - go-mod-cache:/go/pkg/mod
    command: >
      sh -c "
      go install github.com/swaggo/swag/cmd/swag@latest &&
      go install github.com/air-verse/air@latest &&
      air
      "

volumes:
  go-mod-cache:
